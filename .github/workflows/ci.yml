name: FbePreventivatore CI

on:
  pull_request:
    paths:
      - 'FbePreventivatore/**'
  push:
    branches: [main]
    paths:
      - 'FbePreventivatore/**'

defaults:
  run:
    working-directory: FbePreventivatore

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FbePreventivatore/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
