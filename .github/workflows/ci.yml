name: FbePreventivatore CI

on:
  pull_request:
    paths:
      - 'FbePreventivatore/**'
  push:
    branches: [main]
    paths:
      - 'FbePreventivatore/**'

defaults:
  run:
    working-directory: FbePreventivatore

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FbePreventivatore/package-lock.json

      - run: npm ci

      # Prisma 7 non genera il client all'install: senza questo passo @prisma/client
      # non esporta PrismaClient e il typecheck fallisce.
      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
